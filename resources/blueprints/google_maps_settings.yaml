tabs:
  main:
    display: Main
    sections:
      - fields:
          - handle: lat
            field:
              type: float
              display: Latitude
              placeholder: "e.g. 51.5074"
              instructions: "Decimal degrees (-90 to 90). Leave blank for no default."
              instructions_position: above
              validate: "nullable|numeric|between:-90,90"
          - handle: lng
            field:
              type: float
              display: Longitude
              placeholder: "e.g. -0.1278"
              instructions: "Decimal degrees (-180 to 180). Leave blank for no default."
              instructions_position: above
              validate: "nullable|numeric|between:-180,180"
          - handle: zoom
            field:
              type: integer
              display: Zoom
              default: 13
              instructions: "Between 1 (world view) and 21 (street level)."
              instructions_position: above
              validate: "nullable|integer|between:1,21"
          - handle: map_provider
            field:
              type: select
              display: Map Provider
              instructions: "Google requires an API key. OpenStreetMap works without one."
              instructions_position: above
              options:
                google: "Google Maps"
                osm: "OpenStreetMap (no API key needed)"
              default: google
              clearable: false
              validate: "nullable|in:google,osm"
      - display: Infobox
        fields:
          - handle: infobox_title
            field:
              type: text
              display: Infobox Title
              instructions: "Default title shown in the map popup when the marker is clicked. Leave blank for no infobox."
              instructions_position: above
              width: 100
          - handle: infobox_content
            field:
              type: textarea
              display: Infobox Content
              instructions: "Shown below the title in the popup. HTML is supported. Leave blank for no infobox."
              instructions_position: above
              width: 100
      - display: Map Style
        fields:
          - handle: map_style
            field:
              type: textarea
              display: Map Style JSON
              instructions: "Paste style JSON from snazzymaps.com. Applied to Google Maps only. Leave blank for the default style."
              instructions_position: above
              width: 100
